# 金蝶云·苍穹 / 金蝶云·星空 Provider (企业级，中国)
# https://www.kingdee.com/

name: "金蝶云·苍穹/星空"
provider: "Kingdee"
description: "金蝶云 ERP 平台，中国主流企业级 ERP 系统，涵盖财务、供应链、制造、HR 等"
website: "https://www.kingdee.com"
api_style: "rest"

auth:
  type: "oauth2_client"
  token_url: "/kapi/v2/oauth2/token"
  token_header: "accesstoken"
  credential_label: "App ID"
  secret_label: "App Secret"

response:
  success_path: "success"
  error_path: "message"
  token_path: "data.access_token"

entity_paths:
  health: "/kapi/v2/system/health"
  tenant: "/kapi/v2/bas/org/create"
  org: "/kapi/v2/bas/org/dept/create"
  user: "/kapi/v2/bas/user/create"
  role: "/kapi/v2/bas/role/create"
  approval_flow: "/kapi/v2/wf/workflow/create"

tenant_isolation:
  type: "header"
  header_name: "X-Kingdee-TenantId"
default_base_url: "https://api.kingdee.com"

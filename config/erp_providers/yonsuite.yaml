# 用友 YonSuite Provider (企业级，中国)
# https://www.yonyoucloud.com/

name: "用友 YonSuite"
provider: "YonSuite"
description: "用友 YonSuite 云 ERP，中国最大的企业级 ERP 云平台之一"
website: "https://www.yonyoucloud.com"
api_style: "rest"

auth:
  type: "oauth2_client"
  token_url: "/oauth2/token"
  token_header: "Authorization: Bearer"
  credential_label: "App Key"
  secret_label: "App Secret"

response:
  success_path: "code"
  success_value: "00000"
  error_path: "message"
  token_path: "data.access_token"

entity_paths:
  health: "/yonbip/org/open-api/v1/department/list"
  tenant: "/yonbip/org/open-api/v1/tenant/create"
  org: "/yonbip/org/open-api/v1/department/create"
  user: "/yonbip/org/open-api/v1/user/create"
  role: "/yonbip/org/open-api/v1/role/create"
  approval_flow: "/yonbip/workflow/open-api/v1/flow/create"

tenant_isolation:
  type: "header"
  header_name: "tenantId"
default_base_url: "https://openapi.yonyoucloud.com"

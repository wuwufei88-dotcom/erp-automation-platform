# JEECG Boot ERP Provider (开源低代码平台)
# https://github.com/jeecgboot/JeecgBoot

name: "JEECG Boot"
provider: "JEECG"
description: "JEECG 低代码平台，支持组织管理、用户权限、工作流、报表等"
website: "https://www.jeecg.com"
api_style: "rest"

auth:
  type: "oauth2_password"
  token_url: "/sys/login"
  token_header: "X-Access-Token"
  credential_label: "用户名"
  secret_label: "密码"
  captcha_support: "optional"

response:
  success_path: "success"
  error_path: "message"
  token_path: "result.token"

entity_paths:
  health: "/sys/login"
  tenant: "/sys/tenant/add"
  org: "/sys/sysDepart/add"
  user: "/sys/user/add"
  role: "/sys/role/add"
  approval_flow: "/sys/sysDepart/add"

tenant_isolation:
  type: "header"
  header_name: "tenant-id"
default_base_url: "http://localhost:8080/jeecg-boot"

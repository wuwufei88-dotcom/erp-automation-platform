[project]
name = "erp-delivery-backend"
version = "0.1.0"
description = "SaaS ERP automated delivery platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "minio>=7.2.0",
    "pymilvus>=2.4.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "websockets>=14.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx-ws>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
